# Fluent Bit: collects container logs and ships them to Elasticsearch.
#
#   container stdout --(Docker "fluentd" log driver)--> Fluent Bit :24224 --> Elasticsearch --> Kibana
#
# The backend writes one JSON object per line (logback + logstash encoder, profile "json") that
# includes trace_id / span_id; the parser filter below lifts those fields to top-level fields.
[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    storage.metrics on

[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# Spring Boot: JSON in the "log" key -> structured fields (level, message, trace_id, event, ...)
[FILTER]
    Name          parser
    Match         docker.ecommerce-backend
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  Off

# nginx access log lines -> structured fields (method, path, code, ...)
[FILTER]
    Name          parser
    Match         docker.ecommerce-frontend
    Key_Name      log
    Parser        nginx_access
    Reserve_Data  On
    Preserve_Key  On

# Tag every record with the stack and a normalised service name
[FILTER]
    Name    modify
    Match   docker.*
    Add     stack ecommerce

[OUTPUT]
    Name                es
    Match               *
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     ecommerce-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Retry_Limit         False
    Trace_Error         On
