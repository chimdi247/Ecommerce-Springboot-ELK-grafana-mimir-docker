# Prometheus in AGENT mode: scrapes exporters and remote-writes to Mimir (no local TSDB/query).
global:
  scrape_interval: 15s
  scrape_timeout: 10s

remote_write:
  - url: http://mimir:9009/api/v1/push

scrape_configs:
  - job_name: node-exporter
    static_configs: [{ targets: ["node-exporter:9100"] }]

  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]

  - job_name: mysql
    static_configs: [{ targets: ["mysqld-exporter:9104"] }]

  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]

  # Uptime / availability SLI: synthetic probes (blackbox exporter)
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://backend:2424/actuator/health"]
        labels: { service: backend }
      - targets: ["http://frontend/nginx-health"]
        labels: { service: frontend }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # The log pipeline's own health
  - job_name: fluent-bit
    metrics_path: /api/v2/metrics/prometheus
    static_configs: [{ targets: ["fluent-bit:2020"] }]

  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
  - job_name: mimir
    static_configs: [{ targets: ["mimir:9009"] }]
  - job_name: grafana
    static_configs: [{ targets: ["grafana:3000"] }]
