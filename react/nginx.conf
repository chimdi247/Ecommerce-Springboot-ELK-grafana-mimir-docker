server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # health endpoint for docker / uptime probes
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API: /api/product/get-all -> http://backend:2424/product/get-all
    location /api/ {
        proxy_pass http://backend:2424/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # backend rate limiting keys on the first X-Forwarded-For entry
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # long-lived caching for fingerprinted CRA assets
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (React Router)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
