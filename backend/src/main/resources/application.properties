spring.application.name=Phegon-Eccormerce
server.port=2424
# NOTE: do NOT enable server.forward-headers-strategy here: Spring's ForwardedHeaderFilter would strip
# X-Forwarded-For, which the rate limiter reads to tell clients apart behind the nginx proxy.

# ---- Database (override via env; see docker-compose.yml / .env) ----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eshop_spring}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# ---- Security -----------------------------------------------------------------
## admin user: admin@example.com / password123 (only when APP_SEED_ENABLED=true)
# Must be 32+ characters. ALWAYS override JWT_SECRET outside local development.
secreteJwtString=${JWT_SECRET:local-dev-only-change-me-0123456789-abcdefghijklmnop}

# ---- AWS S3 (product image upload) -----------------------------------------------
aws.s3.access=${AWS_S3_ACCESS_KEY:}
aws.s3.secrete=${AWS_S3_SECRET_KEY:}
aws.s3.bucket=${AWS_S3_BUCKET:phegon-eshop}
aws.s3.region=${AWS_S3_REGION:eu-west-2}

# ---- Redis (cache-aside product cache + rate limiting) ---------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
app.cache.product-ttl-seconds=${PRODUCT_CACHE_TTL_SECONDS:600}

# ---- Rate limiting: GET /product/get-all -----------------------------------------
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.get-all-products-limit=${RATE_LIMIT_GET_ALL_PER_WINDOW:30}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.rate-limit.trust-forwarded-headers=${RATE_LIMIT_TRUST_FORWARDED_HEADERS:true}

# ---- Stripe ----------------------------------------------------------------------
app.payment.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.payment.secret-key=${STRIPE_SECRET_KEY:}
app.payment.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payment.currency=${STRIPE_CURRENCY:usd}

# ---- Email (Gmail SMTP by default; use an App Password, not your login password) -
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:no-reply@localhost}}
app.mail.brand-name=${MAIL_BRAND_NAME:Phegon Mart}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.mail.support-email=${MAIL_SUPPORT_EMAIL:${SMTP_USERNAME:support@localhost}}

# ---- Demo data (admin user, categories, products) ---------------------------------
app.seed.enabled=${APP_SEED_ENABLED:false}

# ---- Actuator: health only (container healthcheck + uptime probes) ----------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# A flaky SMTP server must never mark the whole app DOWN
management.health.mail.enabled=false
